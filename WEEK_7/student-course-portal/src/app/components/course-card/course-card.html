<div style="border:1px solid #ccc;padding:15px;margin:10px;border-radius:5px;">

    <h3>{{ course.name }}</h3>
  
    <p><strong>Course ID:</strong> {{ course.id }}</p>
  
    <p><strong>Course Code:</strong> {{ course.code }}</p>
  
    <p><strong>Credits:</strong> {{ course.credits }}</p>
  
    <button (click)="enroll()">
      Enroll
    </button>
  
  </div>
