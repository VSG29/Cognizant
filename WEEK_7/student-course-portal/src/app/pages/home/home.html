<h1>{{ portalName }}</h1>

<p>
  Manage your courses, enrollment and student profile from one place.
</p>

<hr>

<button
  [disabled]="!isPortalActive"
  (click)="onEnrollClick()">
  Enroll Now
</button>

<p>{{ message }}</p>

<hr>

<input
  type="text"
  placeholder="Search Course"
  [(ngModel)]="searchTerm">

<p>Searching for: {{ searchTerm }}</p>

<hr>

<h3>Statistics</h3>

<p><strong>Courses Available:</strong> {{ availableCourses }}</p>

<p><strong>Enrolled:</strong> 3</p>

<p><strong>GPA:</strong> 3.8</p>

<!--
[property] -> One-way binding (Component → DOM)

[(ngModel)] -> Two-way binding (DOM ↔ Component)
-->
